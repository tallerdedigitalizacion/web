<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 476" width="1340" height="476" role="img" aria-label="Orden de trabajo entre los tres proyectos: primero A y B del cierre, después fuentes, después el maestro y por último C a F del cierre, con tres bucles de vuelta"><style>
:root{--surface:#ffffff;--fg:#15222c;--muted:#566774;--line:#c3cfd8;--lane:#eaeff3;--bg:#f4f6f8;
--f:#0b7a72;--fb:#dff1ef;--m:#2a5db3;--mb:#e3ebf9;--c:#9a5d0a;--cb:#f8ecd6;--loop:#c43d24}
text{font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.lane{fill:var(--lane);stroke:var(--line);stroke-width:1}
.ln{font-size:12px;font-weight:700;letter-spacing:.08em;fill:var(--fg)}
.lft{fill:var(--f)}.lmt{fill:var(--m)}.lct{fill:var(--c)}
.n{stroke-width:1.4;fill:var(--surface)}
.nf{stroke:var(--f);fill:var(--fb)}.nm{stroke:var(--m);fill:var(--mb)}.nc{stroke:var(--c);fill:var(--cb)}
.nx{stroke:var(--muted);fill:var(--surface);stroke-dasharray:4 3}
.t1{font-size:13px;font-weight:700;fill:var(--fg)}.t1s{font-size:12px;font-weight:700;fill:var(--fg)}
.t2{font-size:11px;fill:var(--muted)}.t3{font-size:11px;fill:var(--muted)}
.lbl{font-size:11px;font-style:italic;fill:var(--loop)}
.a{fill:none;stroke:var(--fg);stroke-width:1.5;opacity:.75}
.al{fill:none;stroke:var(--loop);stroke-width:1.6;stroke-dasharray:6 4}
.pl{fill:none;stroke:var(--fg);stroke-width:1.5;opacity:.75}
.mk{fill:var(--fg);opacity:.75}.mkl{fill:var(--loop)}
.badge{fill:var(--fg)}.bt{font-size:11px;font-weight:700;fill:var(--surface)}
.vmark{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}.vt{font-size:9.5px;font-weight:700;fill:var(--fg)}
</style><rect width="1340" height="476" fill="#ffffff"/><defs>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="al1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mkl"/></marker>
</defs>
<rect x="10" y="16" width="1320" height="160" rx="8" class="lane lc"/>
<text x="24" y="38" class="ln lct" text-anchor="start">CIERRE</text>
<text x="24" y="54" class="t3" text-anchor="start">lector del maestro</text>
<text x="24" y="67" class="t3" text-anchor="start">escribe solo en</text>
<text x="24" y="80" class="t3" text-anchor="start">CIERRE/</text>
<rect x="10" y="186" width="1320" height="110" rx="8" class="lane lf"/>
<text x="24" y="208" class="ln lft" text-anchor="start">FUENTES</text>
<text x="24" y="224" class="t3" text-anchor="start">escribe en la raíz</text>
<text x="24" y="237" class="t3" text-anchor="start">y en la carpeta</text>
<text x="24" y="250" class="t3" text-anchor="start">del trimestre</text>
<rect x="10" y="306" width="1320" height="130" rx="8" class="lane lm"/>
<text x="24" y="328" class="ln lmt" text-anchor="start">MAESTRO</text>
<text x="24" y="344" class="t3" text-anchor="start">dueño de los datos</text>
<rect x="150" y="28" width="122" height="58" rx="6" class="n nc"/>
<text x="211.0" y="47.0" class="t1" text-anchor="middle">A · Autocotejo</text>
<text x="211.0" y="61.0" class="t2" text-anchor="middle">libros vs. modelos</text>
<text x="211.0" y="75.0" class="t2" text-anchor="middle">sin maestro</text>
<circle cx="148" cy="26" r="10" class="badge"/>
<text x="148" y="30" class="bt" text-anchor="middle">1</text>
<rect x="150" y="102" width="122" height="58" rx="6" class="n nc"/>
<text x="211.0" y="121.0" class="t1" text-anchor="middle">B · Categorías</text>
<text x="211.0" y="135.0" class="t2" text-anchor="middle">IA propone,</text>
<text x="211.0" y="149.0" class="t2" text-anchor="middle">una persona valida</text>
<circle cx="148" cy="100" r="10" class="badge"/>
<text x="148" y="104" class="bt" text-anchor="middle">1</text>
<rect x="290" y="205" width="122" height="56" rx="6" class="n nf"/>
<text x="351.0" y="223.0" class="t1" text-anchor="middle">Fuentes validadas</text>
<text x="351.0" y="237.0" class="t2" text-anchor="middle">paso 0</text>
<text x="351.0" y="251.0" class="t2" text-anchor="middle">originales del trimestre</text>
<circle cx="288" cy="203" r="10" class="badge"/>
<text x="288" y="207" class="bt" text-anchor="middle">2</text>
<rect x="430" y="328" width="170" height="60" rx="6" class="n nm"/>
<text x="515.0" y="348.0" class="t1" text-anchor="middle">Pasos 1–4 · cruce</text>
<text x="515.0" y="362.0" class="t2" text-anchor="middle">convertir · recortar</text>
<text x="515.0" y="376.0" class="t2" text-anchor="middle">normalizar · casar</text>
<circle cx="428" cy="326" r="10" class="badge"/>
<text x="428" y="330" class="bt" text-anchor="middle">3</text>
<rect x="620" y="328" width="170" height="60" rx="6" class="n nm"/>
<text x="705.0" y="348.0" class="t1" text-anchor="middle">Pasos 5–7 · excepciones</text>
<text x="705.0" y="362.0" class="t2" text-anchor="middle">IA · IA con navegador</text>
<text x="705.0" y="376.0" class="t2" text-anchor="middle">personas · script</text>
<circle cx="618" cy="326" r="10" class="badge"/>
<text x="618" y="330" class="bt" text-anchor="middle">4</text>
<rect x="810" y="328" width="150" height="60" rx="6" class="n nm"/>
<text x="885.0" y="348.0" class="t1" text-anchor="middle">Maestro final</text>
<text x="885.0" y="362.0" class="t2" text-anchor="middle">+ RESOLUCIONES</text>
<text x="885.0" y="376.0" class="t2" text-anchor="middle">+ RESIDUO</text>
<rect x="790" y="60" width="108" height="58" rx="6" class="n nc"/>
<text x="844.0" y="79.0" class="t1s" text-anchor="middle">C · Categorizar</text>
<text x="844.0" y="93.0" class="t2" text-anchor="middle">firman</text>
<text x="844.0" y="107.0" class="t2" text-anchor="middle">personas</text>
<circle cx="788" cy="58" r="10" class="badge"/>
<text x="788" y="62" class="bt" text-anchor="middle">5</text>
<rect x="914" y="60" width="108" height="58" rx="6" class="n nc"/>
<text x="968.0" y="79.0" class="t1s" text-anchor="middle">D · Calcular</text>
<text x="968.0" y="93.0" class="t2" text-anchor="middle">303 · 349</text>
<text x="968.0" y="107.0" class="t2" text-anchor="middle">· 115</text>
<rect x="1038" y="60" width="108" height="58" rx="6" class="n nc"/>
<text x="1092.0" y="79.0" class="t1s" text-anchor="middle">E · Cotejar</text>
<text x="1092.0" y="93.0" class="t2" text-anchor="middle">contra lo</text>
<text x="1092.0" y="107.0" class="t2" text-anchor="middle">presentado</text>
<rect x="1162" y="60" width="108" height="58" rx="6" class="n nc"/>
<text x="1216.0" y="79.0" class="t1s" text-anchor="middle">F · Informe</text>
<text x="1216.0" y="93.0" class="t2" text-anchor="middle">para la</text>
<text x="1216.0" y="107.0" class="t2" text-anchor="middle">dirección</text>
<rect x="1017" y="205" width="150" height="56" rx="6" class="n nx"/>
<text x="1092.0" y="223.0" class="t1" text-anchor="middle">El asesor contesta</text>
<text x="1092.0" y="237.0" class="t2" text-anchor="middle">documentos nuevos</text>
<text x="1092.0" y="251.0" class="t2" text-anchor="middle">o corregidos</text>
<path d="M272,57 L351,57 L351,205" class="al" marker-end="url(#al1)"/>
<text x="359" y="128" class="lbl" text-anchor="start">si falta o está desactualizada</text>
<text x="359" y="141" class="lbl" text-anchor="start">una fuente</text>
<path d="M351,261 L351,358 L430,358" class="a" marker-end="url(#ar1)"/>
<path d="M600,358 L620,358" class="a" marker-end="url(#ar1)"/>
<path d="M790,358 L810,358" class="a" marker-end="url(#ar1)"/>
<path d="M844,328 L844,118" class="a" marker-end="url(#ar1)"/>
<text x="852" y="300" class="t2" text-anchor="start">lo leen los lectores</text>
<path d="M272,131 L740,131 L740,89 L790,89" class="a" marker-end="url(#ar1)"/>
<text x="520" y="125" class="t2" text-anchor="start">categorías validadas</text>
<path d="M898,89 L914,89" class="a" marker-end="url(#ar1)"/>
<path d="M1022,89 L1038,89" class="a" marker-end="url(#ar1)"/>
<path d="M1146,89 L1162,89" class="a" marker-end="url(#ar1)"/>
<path d="M1092,118 L1092,205" class="a" marker-end="url(#ar1)"/>
<text x="1100" y="168" class="t2" text-anchor="start">diferencias → preguntas</text>
<path d="M1017,233 L412,233" class="al" marker-end="url(#al1)"/>
<text x="560" y="226" class="lbl" text-anchor="start">llega una fuente nueva o corregida: se vuelve a entrar por aquí</text>
<path d="M760,388 L760,414 L660,414 L660,388" class="al" marker-end="url(#al1)"/>
<text x="772" y="419" class="lbl" text-anchor="start">se repite 5 → 5b → 6 → 7 mientras bajen las excepciones</text>
<path d="M30,456 L80,456" class="a" marker-end="url(#ar1)"/>
<text x="88" y="460" class="t2" text-anchor="start">pasa el trabajo</text>
<path d="M220,456 L270,456" class="al" marker-end="url(#al1)"/>
<text x="278" y="460" class="t2" text-anchor="start">se vuelve a ejecutar</text>
<circle cx="440" cy="456" r="10" class="badge"/><text x="440" y="460" class="bt" text-anchor="middle">1</text>
<text x="458" y="460" class="t2" text-anchor="start">orden de trabajo</text>
</svg>